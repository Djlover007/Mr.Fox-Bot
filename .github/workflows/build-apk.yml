name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Fester Signaturschlüssel, damit Updates ohne Deinstallieren gehen (Daten bleiben erhalten).
      # Ohne das Secret SIGNING_KEYSTORE_BASE64 wird dieser Schritt übersprungen.
      - name: Signaturschlüssel bereitstellen
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mrfox.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/mrfox.jks" >> "$GITHUB_ENV"
            echo "Fester Schlüssel wird verwendet."
          else
            echo "::warning::Kein Secret SIGNING_KEYSTORE_BASE64 – APK wird mit zufälligem Schlüssel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Compiler-Fehler als Hinweise ausgeben (sichtbar in der Zusammenfassung des Laufs)
            # Alle Fehler in EINEM Hinweis (GitHub zeigt nur 10 Hinweise pro Schritt)
            msg=$(grep -E "^e: |What went wrong|> Could not|AAR metadata|requires|Dependency" build.log | sed 's|file:///home/runner/work/[^ ]*/java/de/amazonmonitor/||' | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MrFoxBot-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
